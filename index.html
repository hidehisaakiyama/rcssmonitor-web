<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rcssmonitor-web</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --bar: #f2f2f4;
        --border: #d2d2d7;
        --button: #ffffff;
        --button-hover: #e4e4e8;
        --pressed: #cfe3ff;
        --accent: #0a66d8;
        --error: #c62828;
        --ok: #2e7d32;
        --field: #1fa01f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --fg: #e6e6e6;
          --muted: #9a9aa0;
          --bar: #222225;
          --border: #3a3a3e;
          --button: #2c2c30;
          --button-hover: #3a3a3f;
          --pressed: #23406b;
          --accent: #5ea2ff;
          --error: #ff6b6b;
          --ok: #66bb6a;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .toolbar,
      .statusbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        background: var(--bar);
        border-color: var(--border);
        border-style: solid;
        border-width: 0;
        min-width: 0;
      }
      .toolbar {
        flex-wrap: wrap;
        row-gap: 4px;
        border-bottom-width: 1px;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .toolbar-slider {
        flex: 1;
        gap: 8px;
        min-width: 160px;
      }
      .tool-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 26px;
        padding: 0;
        color: var(--fg);
        background: var(--button);
        border: 1px solid var(--border);
        border-radius: 4px;
        cursor: pointer;
      }
      .tool-button:hover:not(:disabled) {
        background: var(--button-hover);
      }
      .tool-button[aria-pressed='true'] {
        background: var(--pressed);
        border-color: var(--accent);
      }
      .tool-button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .tool-button:focus-visible,
      #cycle-input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      #cycle-input {
        width: 5.5em;
        padding: 2px 4px;
        color: var(--fg);
        background: var(--button);
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
      }
      #cycle-input.invalid {
        border-color: var(--error);
      }
      .speed-label {
        min-width: 4.5em;
        text-align: right;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #app.drop-target .field-view::after {
        content: 'Drop a game log to open it';
        position: absolute;
        inset: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px dashed #ffffff;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
        color: #ffffff;
        font-size: 20px;
        pointer-events: none;
      }
      .statusbar {
        border-top-width: 1px;
        color: var(--muted);
      }
      #frame-slider {
        flex: 1;
        min-width: 80px;
        accent-color: var(--accent);
      }
      .frame-label,
      .mouse-pos {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .status-message {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .field-view {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: var(--field);
        user-select: none;
      }
      .field-view canvas {
        position: absolute;
        left: 0;
        top: 0;
      }
      .connection-status {
        white-space: nowrap;
      }
      .connection-status::before {
        content: '●';
        margin-right: 4px;
        color: var(--muted);
      }
      .connection-status[data-state='connected']::before {
        color: var(--ok);
      }
      .connection-status[data-state='waiting']::before {
        color: var(--error);
      }
      .context-menu {
        position: fixed;
        z-index: 10;
        min-width: 160px;
        padding: 4px 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        outline: none;
      }
      .menu-submenu {
        position: relative;
      }
      .menu-submenu > .context-menu {
        position: absolute;
      }
      .menu-item {
        display: block;
        width: 100%;
        padding: 3px 24px 3px 16px;
        color: var(--fg);
        background: none;
        border: 0;
        font: inherit;
        text-align: left;
        white-space: nowrap;
        cursor: default;
      }
      .menu-item[aria-haspopup]::after {
        content: '▸';
        position: absolute;
        right: 8px;
      }
      .menu-item:hover:not(:disabled),
      .menu-item:focus-visible,
      .menu-item[aria-expanded='true'] {
        background: var(--pressed);
        outline: none;
      }
      .menu-item:disabled {
        color: var(--muted);
        opacity: 0.6;
      }
      .menu-separator {
        height: 1px;
        margin: 4px 0;
        background: var(--border);
      }
      .dialog {
        min-width: 320px;
        max-width: min(480px, calc(100vw - 32px));
        padding: 16px 20px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      .dialog::backdrop {
        background: rgba(0, 0, 0, 0.3);
      }
      .dialog-title {
        margin: 0 0 12px;
        font-size: 15px;
      }
      .dialog-row {
        display: grid;
        grid-template-columns: 5em 1fr;
        align-items: center;
        column-gap: 8px;
        margin: 6px 0;
      }
      .dialog-row input:not([type='checkbox']),
      .dialog-row select {
        min-width: 0;
        padding: 3px 6px;
        color: var(--fg);
        background: var(--button);
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
      }
      .dialog-row input:disabled {
        opacity: 0.5;
      }
      .dialog-hint {
        grid-column: 2;
        color: var(--muted);
        font-size: 12px;
      }
      .dialog-check {
        display: flex;
        gap: 6px;
        margin-left: calc(5em + 8px);
      }
      .dialog-warning {
        margin: 8px 0 0;
        color: var(--error);
        font-size: 12px;
      }
      .dialog-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      .dialog-button {
        min-width: 80px;
        padding: 4px 12px;
        color: var(--fg);
        background: var(--button);
        border: 1px solid var(--border);
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }
      .dialog-button.default {
        color: #ffffff;
        background: var(--accent);
        border-color: var(--accent);
      }
      .dialog-button:focus-visible,
      .dialog-row :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
