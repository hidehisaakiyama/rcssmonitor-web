name: CI

# Branches (docs/release.md): main has the releases, develop gathers the
# work, feature/* and hotfix/* branch off them.
on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Named, not ubuntu-latest, which moves to a new image now and then.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium firefox
      # On a virtual display: without one, headless Firefox has no WebGL (the 3D view).
      - run: xvfb-run -a npm run test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: rcssmonitor-web-single
          path: dist-single/rcssmonitor-web.html
