name: CI

# Branches (docs/release.md): main has the releases, develop gathers the
# work, feature/* and hotfix/* branch off them.
on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: rcssmonitor-web-single
          path: dist-single/rcssmonitor-web.html
